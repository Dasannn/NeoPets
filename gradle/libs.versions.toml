[versions]
paper-api = "26.3.build.211-stable"
junit = "5.14.4"
hikaricp = "7.1.0"
mysql-connector-j = "26.10.0"
sqlite-jdbc = "3.53.4.0"
flyway = "13.11.1"
vault-api = "1.7.1"
luckperms-api = "5.5"
placeholderapi = "2.12.3"
archunit = "1.5.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector-j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
flyway = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms-api" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
