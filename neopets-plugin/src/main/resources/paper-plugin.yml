name: NeoPets
version: '${version}'
main: dev.dasannn.neopets.plugin.NeoPetsPlugin
bootstrapper: dev.dasannn.neopets.plugin.bootstrap.NeoPetsBootstrap
loader: dev.dasannn.neopets.plugin.bootstrap.NeoPetsLoader
api-version: '26.3'
dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
    LuckPerms:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
permissions:
  neopets.use:
    default: true
  neopets.admin:
    default: false
    children:
      neopets.admin.give: true
      neopets.admin.sp: true
      neopets.admin.revive: true
      neopets.admin.reset: true
      neopets.admin.gui: true
      neopets.admin.reload: true
      neopets.admin.update: true
  neopets.admin.give:
    default: false
  neopets.admin.sp:
    default: false
  neopets.admin.revive:
    default: false
  neopets.admin.reset:
    default: false
  neopets.admin.gui:
    default: false
  neopets.admin.reload:
    default: false
  neopets.admin.update:
    default: false
